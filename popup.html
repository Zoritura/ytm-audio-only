<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Music Audio Mode</title>
    <style>
      body {
        min-width: 220px;
        margin: 0;
        padding: 16px;
        color: #202124;
        font: 14px/1.4 Arial, sans-serif;
      }

      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      #status {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: #5f6368;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <label for="enabled">
      <span>Automatic audio mode</span>
      <input id="enabled" type="checkbox" disabled>
    </label>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
